name: SignalSort
options:
  bundleIdPrefix: com.selinkaplan
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 67ANTJMF7U
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  GameCore:
    path: Packages/GameCore
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    exactVersion: 13.11.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    exactVersion: 3.1.0
targets:
  SignalSort:
    type: application
    platform: iOS
    sources:
      - path: SignalSort
        excludes: ["**/.gitkeep", "Resources/Info.plist"]
    dependencies:
      - package: GameCore
        product: GameCore
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - sdk: AppTrackingTransparency.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selinkaplan.signalsort
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SignalSort/Resources/Info.plist
        INFOPLIST_KEY_NSUserTrackingUsageDescription: "Signal Sort is free thanks to ads. Allowing tracking lets ads be more relevant to you."
        # Debug: Google'ın test kimlikleri (kendi reklamına tıklamak AdMob hesabını riske atar).
        # Release'teki gerçek kimlikler aşağıda `configs`'te; arşiv, test kimliği kalırsa bilerek başarısız olur.
        ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
        ADMOB_REWARDED_ID: ca-app-pub-3940256099942544/1712485313
        ADMOB_INTERSTITIAL_ID: ca-app-pub-3940256099942544/4411468910
        INFOPLIST_KEY_CFBundleDisplayName: Signal Sort
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.puzzle-games
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          ADMOB_APP_ID: ca-app-pub-1984328158177269~4766668480
          ADMOB_REWARDED_ID: ca-app-pub-1984328158177269/8009663511
          ADMOB_INTERSTITIAL_ID: ca-app-pub-1984328158177269/3300262317
    preBuildScripts:
      - name: Guard AdMob IDs on archive
        basedOnDependencyAnalysis: false
        script: |
          if [ "$ACTION" = "install" ]; then
            for ID in "$ADMOB_APP_ID" "$ADMOB_REWARDED_ID" "$ADMOB_INTERSTITIAL_ID"; do
              if echo "$ID" | grep -q "3940256099942544"; then
                echo "error: Release arşivinde Google test AdMob kimliği var ($ID). project.yml > configs > Release değerlerini gerçek kimliklerle değiştirin."
                exit 1
              fi
            done
          fi
  SignalSortTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SignalSortTests
      - path: StoreKit/SignalSort.storekit
        buildPhase: resources
    dependencies:
      - target: SignalSort
      - package: GameCore
        product: GameCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selinkaplan.signalsort.tests
        GENERATE_INFOPLIST_FILE: YES
  SignalSortUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SignalSortUITests]
    dependencies:
      - target: SignalSort
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selinkaplan.signalsort.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SignalSort
schemes:
  SignalSort:
    build:
      targets:
        SignalSort: all
    run:
      storeKitConfiguration: StoreKit/SignalSort.storekit
    test:
      gatherCoverageData: true
      targets:
        - SignalSortTests
        - SignalSortUITests
