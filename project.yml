name: SignalSort
options:
  bundleIdPrefix: com.selinkaplan
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  GameCore:
    path: Packages/GameCore
targets:
  SignalSort:
    type: application
    platform: iOS
    sources:
      - path: SignalSort
        excludes: ["**/.gitkeep"]
    dependencies:
      - package: GameCore
        product: GameCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selinkaplan.signalsort
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Signal Sort
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.puzzle-games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  SignalSortTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SignalSortTests]
    dependencies:
      - target: SignalSort
      - package: GameCore
        product: GameCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selinkaplan.signalsort.tests
        GENERATE_INFOPLIST_FILE: YES
  SignalSortUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SignalSortUITests]
    dependencies:
      - target: SignalSort
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selinkaplan.signalsort.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SignalSort
schemes:
  SignalSort:
    build:
      targets:
        SignalSort: all
    test:
      gatherCoverageData: true
      targets:
        - SignalSortTests
        - SignalSortUITests
